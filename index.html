<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบซักประวัติและสื่อสารแปลภาษาไทย-พม่า - รพ.สต.บ้านขอม</title>
    <!-- โหลด PeerJS สำหรับเชื่อมต่อมือถือกับ PC แบบเรียลไทม์ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 10px; background-color: #f0f2f5; display: flex; flex-direction: column; height: 98vh; justify-content: center; align-items: center; }
        
        .panel { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow-y: auto; border-top: 6px solid #2e7d32; background-color: #f9fbe7; }

        h2 { margin-top: 0; color: #333; font-size: 1.2rem; border-bottom: 2px solid #ddd; padding-bottom: 8px; text-align: center; }
        
        .category-group { margin-bottom: 12px; }
        .category-group label { display: block; font-size: 0.9rem; color: #2e7d32; margin-bottom: 5px; font-weight: bold; }
        
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
        select.question-select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #2e7d32; background: #e8f5e9; font-size: 0.95rem; cursor: pointer; }
        
        .btn-add { background: #2e7d32; color: white; border: none; border-radius: 8px; padding: 0 16px; font-weight: bold; cursor: pointer; }
        .btn-add:hover { background: #1b5e20; }

        textarea { width: 100%; height: 60px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem; margin-bottom: 8px; resize: vertical; }
        
        .patient-textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #81c784;
            font-size: 1.05rem;
            margin-bottom: 8px;
            resize: vertical;
            background-color: #ffffff;
        }

        button.action-btn { padding: 12px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-send { background: #0288d1; color: white; margin-bottom: 8px; }
        .btn-send:hover { background: #0277bd; }

        /* กล่องแสดงรายการที่เลือก */
        .selected-box {
            border: 2px dashed #81c784;
            border-radius: 8px;
            padding: 10px;
            background-color: #ffffff;
            min-height: 60px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-bottom: 12px;
        }
        .tag-item {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
        }
        .tag-remove {
            background: none;
            border: none;
            color: #15803d;
            margin-left: 6px;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
            font-weight: bold;
        }

        .patient-status { text-align: center; font-size: 0.9rem; font-weight: bold; color: #388e3c; margin: 6px 0; padding: 6px; background: #e8f5e9; border-radius: 6px; }

        .btn-mic-mobile { background: #ffffff; color: #1b5e20; font-size: 1rem; padding: 12px; border-radius: 8px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 3px solid #2e7d32; font-weight: bold; margin-top: 10px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        .btn-mic-mobile.recording { background: #f44336; color: white; border-color: #d32f2f; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- หน้าจอมือถือผู้ป่วย -->
    <div id="patientMobilePanel" class="panel">
        <h2>🇲🇲 ฝั่งผู้ป่วย (Patient Display)</h2>
        
        <div class="category-group">
            <label>📋 เลือกตอบอาการด่วน (အမြန်အဖြေရွေးရန်):</label>
            <div class="input-group">
                <select id="symptom-select" class="question-select">
                    <option value="" disabled selected hidden>-- เลือกอาการ / ရောဂါလက္ခဏာရွေးပါ --</option>
                    <option value="กลืนลำบาก" data-my="မျိုချရခက်ခဲခြင်း">กลืนลำบาก</option>
                    <option value="ไข้" data-my="ဖျားခြင်း">ไข้</option>
                    <option value="คลื่นไส้และอาเจียน" data-my="ပျို့အန်ခြင်း">คลื่นไส้และอาเจียน</option>
                    <option value="เจ็บคอ" data-my="လည်ပင်းနာခြင်း">เจ็บคอ</option>
                    <option value="ทำแผล" data-my="အနာဆေးကြောခြင်း">ทำแผล</option>
                    <option value="ปวดหัว" data-my="ခေါင်းကိုက်သည်">ปวดหัว</option>
                    <option value="ท้องเสีย" data-my="ဝမ်းပျက်ဝမ်းလျှောသည်">ท้องเสีย</option>
                    <option value="ปวดหลัง" data-my="ကျောကိုက်သည်">ปวดหลัง</option>
                    <option value="ขอใบแพทย์" data-my="ဆေးလက်မှတ်တောင်းသည်">ขอใบแพทย์</option>
                </select>
                <button type="button" class="btn-add" onclick="addSymptom()">เพิ่ม</button>
            </div>
        </div>

        <!-- ช่องแสดงรายการที่เลือก -->
        <label style="font-size: 0.85rem; font-weight: bold; color: #2e7d32;">ပြသရန် အချက်အလက်များ (แสดงรายการ):</label>
        <div id="selected-symptoms-container" class="selected-box">
            <span style="color: #666; font-size: 0.9rem;" id="txt-no-sym">ยังไม่ได้เลือกรายการ</span>
        </div>

        <div id="patientStatusMobile" class="patient-status">
            🔊 เลือกรายการด้านบน หรือพิมพ์เพิ่มเติมด้านล่าง
        </div>

        <!-- ช่องพิมพ์นอกเหนือจากรายการ -->
        <label style="margin-top: 6px; font-size: 0.85rem; font-weight: bold; color: #2e7d32;">စာရင်းပြင်ပ အခြားအချက်အလက်များ ရိုက်ထည့်ရန် (พิมพ์นอกเหนือจากรายการ):</label>
        <textarea id="patientCustomInput" class="patient-textarea" placeholder="พิมพ์ข้อความเพิ่มเติมที่ต้องการแจ้งเจ้าหน้าที่..."></textarea>
        <button class="action-btn btn-send" onclick="sendPatientCustomText()">ส่งข้อความ</button>

        <!-- ปุ่มไมค์พูดภาษาพม่า -->
        <button id="mobileMicBtn" class="btn-mic-mobile" onclick="toggleMobileSpeech()">
            🎤 กดไมล์พูดภาษาพม่า (မြန်မာလိုပြောဖို့ နှိပ်ပါ)
        </button>
    </div>

    <script>
        let peer;
        let conn;
        const FIXED_OFFICER_ID = 'bh-bankhom-officer-main';
        let selectedSymptoms = []; // เก็บรายการที่เลือก

        // เริ่มต้นทำงานฝั่งผู้ป่วยทันที
        initPatientMode();

        function initPatientMode() {
            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect(FIXED_OFFICER_ID);
                
                conn.on('open', () => {
                    console.log("Connected to Officer PC");
                });

                conn.on('data', (data) => {
                    if (data.type === 'CLEAR_SCREEN') {
                        selectedSymptoms = [];
                        renderSymptoms();
                        document.getElementById('patientStatusMobile').innerText = '🔊 ล้างข้อมูลเรียบร้อย พร้อมเลือกรายการใหม่';
                        document.getElementById('patientStatusMobile').style.color = '#388e3c';
                    }
                });
            });
        }

        // ฟังก์ชันกดปุ่ม "เพิ่ม" อาการด่วน
        function addSymptom() {
            const select = document.getElementById('symptom-select');
            const thVal = select.value;
            if (!thVal) return;

            const selectedOption = select.options[select.selectedIndex];
            const myVal = selectedOption.getAttribute('data-my');

            // เช็คว่าเคยเลือกไปแล้วหรือยัง
            const isAlreadyAdded = selectedSymptoms.some(item => item.th === thVal);
            if (!isAlreadyAdded) {
                selectedSymptoms.push({ th: thVal, my: myVal });
                renderSymptoms();
                sendDataToOfficer();
            }
            select.value = "";
        }

        // ฟังก์ชันลบรายการที่เลือกออก
        function removeSymptom(thVal) {
            selectedSymptoms = selectedSymptoms.filter(item => item.th !== thVal);
            renderSymptoms();
            sendDataToOfficer();
        }

        // แสดงผลรายการที่เลือกในกล่อง Tag
        function renderSymptoms() {
            const container = document.getElementById('selected-symptoms-container');
            
            if (selectedSymptoms.length === 0) {
                container.innerHTML = `<span style="color: #666; font-size: 0.9rem;" id="txt-no-sym">ยังไม่ได้เลือกรายการ</span>`;
                return;
            }

            container.innerHTML = '';
            selectedSymptoms.forEach(item => {
                const tag = document.createElement('span');
                tag.className = 'tag-item';
                tag.innerHTML = `
                    ${item.th} (${item.my})
                    <button type="button" class="tag-remove" onclick="removeSymptom('${item.th}')">&times;</button>
                `;
                container.appendChild(tag);
            });
        }

        // ส่งข้อมูลรายการทั้งหมดไปให้ฝั่งเจ้าหน้าที่
        function sendDataToOfficer() {
            if (conn && conn.open && selectedSymptoms.length > 0) {
                const combinedText = selectedSymptoms.map(item => item.th).join(', ');
                conn.send({ type: 'PATIENT_SPEECH', text: combinedText });
                document.getElementById('patientStatusMobile').innerText = '✅ อัปเดตรายการส่งให้เจ้าหน้าที่แล้ว';
                document.getElementById('patientStatusMobile').style.color = '#2e7d32';
            }
        }

        // ฟังก์ชันส่งข้อความเพิ่มเติมจากผู้พิมพ์ข้อความเอง
        function sendPatientCustomText() {
            const customInput = document.getElementById('patientCustomInput').value.trim();
            if (!customInput) return;

            // เพิ่มข้อความพิมพ์เองเข้าไปในรายการด้วย
            selectedSymptoms.push({ th: customInput, my: customInput });
            renderSymptoms();

            document.getElementById('patientStatusMobile').innerText = '✅ ส่งข้อความเพิ่มเติมเรียบร้อย';
            document.getElementById('patientStatusMobile').style.color = '#2e7d32';

            if (conn && conn.open) {
                const combinedText = selectedSymptoms.map(item => item.th).join(', ');
                conn.send({ type: 'PATIENT_SPEECH', text: combinedText });
            }
            document.getElementById('patientCustomInput').value = '';
        }

        let mobileRecognition;
        let isMobileRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            mobileRecognition = new SpeechRecognition();
            mobileRecognition.lang = 'my-MM';
            mobileRecognition.continuous = false;
            mobileRecognition.interimResults = false;

            mobileRecognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                selectedSymptoms.push({ th: speechText, my: speechText });
                renderSymptoms();
                
                if (conn && conn.open) {
                    const combinedText = selectedSymptoms.map(item => item.th).join(', ');
                    conn.send({ type: 'PATIENT_SPEECH', text: combinedText });
                }
            };

            mobileRecognition.onend = function() {
                isMobileRecording = false;
                const micBtn = document.getElementById('mobileMicBtn');
                if(micBtn) {
                    micBtn.classList.remove('recording');
                    micBtn.innerHTML = '🎤 กดไมล์พูดภาษาพม่า (မြန်မာလိုပြောဖို့ နှိပ်ပါ)';
                }
                document.getElementById('patientStatusMobile').innerText = '🔊 บันทึกเสียงพูดเรียบร้อย';
                document.getElementById('patientStatusMobile').style.color = '#388e3c';
            };
        }

        function toggleMobileSpeech() {
            if (!mobileRecognition) {
                alert('เบราว์เซอร์มือถือไม่รองรับการแปลงเสียง แนะนำให้ใช้ Google Chrome ครับ');
                return;
            }
            const micBtn = document.getElementById('mobileMicBtn');
            const status = document.getElementById('patientStatusMobile');

            if (!isMobileRecording) {
                mobileRecognition.start();
                isMobileRecording = true;
                micBtn.classList.add('recording');
                micBtn.innerHTML = '🔴 กำลังฟัง... พูดภาษาพม่าได้เลย (စကားပြောပါ)';
                status.innerText = '🎙️ กำลังฟังเสียงของคุณ...';
                status.style.color = '#d32f2f';
            } else {
                mobileRecognition.stop();
            }
        }
    </script>
</body>
</html>
